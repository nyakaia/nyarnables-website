<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery - Nyarnables</title>

<link rel="stylesheet" href="css/main.css" />

</head>


<body>

<!-- Pink top bar -->
<div class="topbar"></div>


<!-- Header container (clouds, logo, nav) -->
<div class="container">

  <!-- Clouds -->
  <img src="images/cloudleft.png" class="cloud cloud-left">
  <img src="images/cloudright.png" class="cloud cloud-right">
  <img src="images/cloudcenter.png" class="cloud cloud-center">

  <!-- Logo -->
  <img src="images/logo.png" alt="Nyarnables logo" class="logo">

  <!-- Navigation -->
  <div class="nav">

    <div class="nav-home">
      <a href="index.html">
        <img src="images/buttonhome.png" class="navbtn">
      </a>
    </div>

    <div class="nav-shop">
      <a href="shop.html">
        <img src="images/buttonshop.png" class="navbtn">
      </a>
    </div>

    <div class="nav-gallery">
      <a href="gallery.html">
        <img src="images/buttongallery.png" class="navbtn">
      </a>
    </div>

  </div>

</div>


<!-- ================================= -->
<!-- BOUQUET IMAGE GALLERY -->
<!-- These are just images with hover -->
<!-- Clicking them opens the shop item -->
<!-- ================================= -->

<div class="bouquet-wrapper">

  <!-- Red bouquet -->
  <div class="bouquet">
    <a href="shop.html#bouquet-red">
      <img src="images/bouquetred.png" alt="Red Bouquet">
    </a>
  </div>

  <!-- Pink bouquet -->
  <div class="bouquet">
    <a href="shop.html#bouquet-pink">
      <img src="images/bouquetpink.png" alt="Pink Bouquet">
    </a>
  </div>

  <!-- Blue bouquet -->
  <div class="bouquet">
    <a href="shop.html#bouquet-blue">
      <img src="images/bouquetblue.png" alt="Blue Bouquet">
    </a>
  </div>

</div>


<!-- Strawberry animation container -->
<div class="strawberry-container"></div>

<script src="js/strawberry.js"></script>

</body>
</html>
